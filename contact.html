<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تواصل معنا | فريدة</title><link rel="icon" type="image/png" href="assets/farida-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="font.css"></head><body><main><section><div class="wrap grid contact"><aside class="contact-card"><h2>يسعدنا الحديث معك</h2><p>سواء كنت موزعًا، مستوردًا، مزرعة أو شريك تصنيع، شاركنا احتياجك وسيتواصل معك الفريق المختص بعد اعتماد قنوات التواصل الرسمية.</p><hr style="border-color:rgba(255,255,255,.2)"><p><b>المصنع</b><br>المنطقة الصناعية - مدينة السادات، مصر</p><p><b>مجالات التواصل</b><br>التوزيع والتصدير - التوريد الزراعي - الشراكات التجارية - الإعلام</p></aside><form class="form" onsubmit="event.preventDefault();this.innerHTML='<div class=&quot;contact-card&quot; style=&quot;grid-column:1/-1&quot;><h2>شكرًا لتواصلك</h2><p>تم تسجيل بيانات الرسالة في نموذج المعاينة.</p></div>'"><input required aria-label="الاسم" placeholder="الاسم"><input required type="email" aria-label="البريد الإلكتروني" placeholder="البريد الإلكتروني"><input aria-label="اسم الشركة" placeholder="اسم الشركة"><select aria-label="نوع الاستفسار"><option>نوع الاستفسار</option><option>توزيع واستيراد</option><option>توريد زراعي</option><option>تعاون تجاري</option><option>إعلام</option></select><textarea required aria-label="الرسالة" placeholder="اكتب رسالتك"></textarea><button class="btn" type="submit">إرسال الرسالة</button></form></div></section></main><script src="app.js"></script><script src="script.js"></script></body></html>
